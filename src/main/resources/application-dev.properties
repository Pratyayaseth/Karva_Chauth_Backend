# =====================================================================

# KARVA CHAUTH - LOCAL TESTER (laptop + ngrok)

# Server se forward hoke asli WhatsApp / CTA payload yahan aata hai

# =====================================================================

spring.application.name=karvachauth

#server.port=8086
server.port=${PORT:8086}


#karix.waba.number=917795618702
#karix.api.url=https://rcmapi.instaalerts.zone/services/rcm/sendMessage
#karix.api.key=qeaEYqrIQY5cIvbjVEGJ2A==
# ---------- Local MySQL (tester ke laptop pe) ----------

spring.datasource.url = jdbc:mysql://localhost:3306/karva_chauth_db
spring.datasource.username=root
spring.datasource.password=predator@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

spring.jpa.show-sql=false

# so you can send the opener via /test
karvachauth.test.enabled=true
# ---------- Karix ----------

# Key khaali = laptop se WhatsApp reply nahi jaayega (server bhi bhejega -> double reply hoga)

karix.api.url=https://rcmapi.instaalerts.zone/services/rcm/sendMessage

karix.api.key=qeaEYqrIQY5cIvbjVEGJ2A==

karix.waba.number=917795618702

karix.auth.header-name=Authentication

karix.webhook-dn-id=

karvachauth.karix.connect-timeout-ms=3000

karvachauth.karix.read-timeout-ms=10000

karvachauth.karix.max-retries=2

# ---------- Webhook ----------

# Server se forward hoke aata hai, token nahi hota

karvachauth.webhook.auth-enabled=false

karvachauth.webhook.auth-token=local-test-token

karvachauth.webhook.max-body-bytes=262144

# ---------- Service Bus OFF ----------

karvachauth.servicebus.enabled=false

karvachauth.servicebus.connection-string=

karvachauth.servicebus.inbound-queue=karvachauth-inbound

karvachauth.servicebus.status-queue=karvachauth-status

# ---------- Forward OFF (laptop khud ko forward na kare, warna loop) ----------

karvachauth.forward.enabled=false

karvachauth.forward.url=

# ---------- Logs ----------

logging.level.root=INFO

logging.level.org.example.karvachauth=DEBUG

logging.level.com.azure=WARN
